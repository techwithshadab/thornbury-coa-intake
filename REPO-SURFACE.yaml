# REPO-SURFACE — what this repo IS, so the repo-fitness bar applies only the parts that fit.
# Draft stamped by the scaffolder — CONFIRM it: set repo_kind and the surfaces that are true.
# The universal core always applies; each surface set `true` switches on that conditional pack in
# the repo-fitness skill's references/RUBRIC.md. A false `false` hides a real obligation; a false
# `true` invites N/A findings.
repo_kind: rules-engine          # service | library | cli | frontend | data-pipeline | iac | model-ai | rules-engine | tool
owned_command: make check
criticality: regulated    # sandbox | internal | production | regulated
surfaces:
  deployed              : false # runs as a long-lived service (→ shutdown, timeouts/retries, health, telemetry, safe defaults)
  stateful              : false # owns persistent data (→ migrations, retention, resource cleanup, tested restore)
  user_facing           : false # exposed to external callers (→ authz default-deny, injection defense, backward-compat)
  has_consumers         : true  # other code/teams depend on its contract (→ backward-compat contract, deprecation)
  handles_pii           : false # processes personal data (→ PII-in-logs redaction, retention)
  handles_secrets       : false # FLIPS TRUE when an LLM extractor lands (an API key). Nothing uses a credential today.
  external_network      : false # FLIPS TRUE with the same change. No outbound call exists today.
  decisioning_or_scoring: true  # derives/ranks/matches/decides (→ externalized policy, provenance, explanation, abstain)
  data_measurement      : true  # carries measured/analytics values (→ {value,unit,source}, canonicalize-on-write, schema-on-read)
  generated_code        : true  # commits generated artifacts (→ regenerate-clean-diff freshness)
  stores_or_shows_time  : true  # stores or displays timestamps (→ tz-aware UTC at rest, locale formatter, DST tests)
  compute_or_ci_heavy   : false # expensive jobs / heavy CI (→ efficiency: bounded CI, timeouts, caching, budgets)

# One paragraph, also mirrored into docs/overview.md:
#  - the one concern + its entry point (the canonical path)
#  - where config/truth lives + the one config boundary
#  - the external boundaries: inputs, outputs, APIs, events, files, secrets, network, persisted state
notes: |
  Reads supplier Certificates of Analysis and decides, against SPEC-7 rev D, whether a lot is
  accepted into the ERP or held for a human. The judgement is the product; the data entry is the
  volume. Thornbury's asymmetry governs the design: a wrong accept is a recall conversation, a
  wrong hold is a day of delay.

  One concern, one entry point: `coa-intake` -> cli.main -> cli.run -> app.decide.
  Config/truth: reviewed reference data in reference/, DERIVED by tools/derive_reference.py from
  the controlled sources vendored in reference/source/. The one config boundary is paths.py, the
  sole reader of the environment.

  External boundaries. Inputs: a documents directory and a reference directory, both runtime
  arguments -- never constants, because this runs against documents it has not seen. Outputs:
  decisions.jsonl, one line per document, carrying schema_version. Contracts consumed: SPEC-7 rev D
  section 2 and the ERP supplier master. Persisted state: none. Secrets: none today. Network: none
  today -- both flip when an LLM extractor lands, and that change also raises the question, not yet
  asked, of whether certificate text may leave Thornbury's boundary.

  deployed and stateful are false and EXPECTED TO BECOME TRUE. Their obligations are the go-live
  backlog in STATUS.md, not silently-passed lines.
