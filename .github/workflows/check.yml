# The owned command, in CI, on every PR. Same `make check` a developer runs — not a re-implementation
# of it, which is how CI and local drift until neither is trusted.
#
# Make this a REQUIRED status check on `main` (CONVENTIONS.md). A CI job that exists but does not block
# merge is a notification, not a gate.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # least privilege: this job only reads the tree

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # bounded: a hung job is a blocked merge queue
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. A tag can be moved.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: setup
        run: make setup

      - name: check
        run: make check

      # The repo's central claim is that the committed submission reproduces from the vendored
      # corpus. Until now nothing gated it: `make check` never ran the pipeline end to end, so a
      # change that altered a decision would have gone green. `git diff --exit-code` is the gate —
      # if the output moves, the commit has to say so.
      - name: the committed submission still reproduces
        run: |
          make submission
          git diff --exit-code -- submissions/ \
            || { echo "::error::make submission changed the committed output"; exit 1; }

      # The placeholder gate runs as a WARNING inside `make check` by design — a fresh scaffold is full
      # of them on day one. On a PR it is fatal: template text reads as filled, so a reader skips it.
      - name: no template text left
        run: make placeholders STRICT=1
