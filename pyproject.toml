# Thornbury CoA intake — package config.
# Toolchain pins are EXACT, not floors: these tools decide pass/fail, so a floor would make
# whatever released this week part of the gate. `ruff` must stay identical to the `rev:` in
# .pre-commit-config.yaml — ruff's formatter changes output between releases, and a mismatch makes
# `make check` unwinnable (the hook rewrites a file one way, `ruff format --check` rejects it).
# Bump both in the same commit.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-intake"
version = "0.1.0"
description = "Reads supplier Certificates of Analysis and decides, against SPEC-7, whether a lot is accepted or held for a human."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2,<3",     # the trust boundary (raw.py): strict models, extra='forbid'
]

[project.scripts]
coa-intake = "coa_intake.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.16.1",       # MUST equal .pre-commit-config.yaml rev
    "pytest==9.1.1",   # 8.3.4 carries PYSEC-2026-1845; caught by `make audit`
    "pip-audit==2.7.3",   # the CVE gate in `make audit`
    # The hygiene gate itself. Previously taken from whatever the machine happened to have, which
    # meant `make check` passed locally and failed on a clean runner -- the exact "green only where
    # the work was done" trap. A gate that decides pass/fail is a pinned input like any other.
    "pre-commit==4.0.1",
    # F7: proves the suite is order-independent rather than asserting it. Randomises test order
    # every run, so a test that only passes because another ran first fails loudly.
    "pytest-randomly==3.16.0",
    # F8: unused declared deps and undeclared imports. Both rot quietly.
    "deptry==0.21.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Hermetic + order-independent: the suite must not depend on wall-clock, network, or file order.
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 110
# `.claude/` is agent tooling the engine scaffolder vendors in — not this repo's source, and any fix
# made there is reverted by the next re-scaffold. `.venv/` is the local toolchain.
# `engagement/` is the SUPPLIED material — the brief, the corpus, and the engagement's own
# validate_submission.py. Linting it is meaningless and fixing it would be worse: the validator we
# run has to be the one we were given, byte for byte, or checking our output against it proves
# nothing. Excluded for the same reason as `.claude/` — vendored, not ours to change.
exclude = [".claude", ".venv", "engagement"]

[tool.ruff.lint]
# C901 is the complexity ceiling (universal core: "a complexity ceiling where the stack supports it").
select = ["E", "F", "I", "B", "C901", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv]
# The interpreter is a PINNED INPUT, not "whatever python is on PATH". Without this, uv adopts any
# system interpreter matching requires-python — on the machine this repo was stood up on that was an
# Anaconda 3.11.5 with a broken `_ctypes` (missing libffi), which took out the CVE audit and would
# have taken out anything else touching ctypes. `only-managed` makes uv download and use its own
# CPython, so two clones get the identical interpreter.
python-preference = "only-managed"

[tool.deptry.per_rule_ignores]
# DEP002 is "declared but never imported". These six are declared because the Makefile EXECUTES
# them — they are the gate, not libraries the code calls. That is a legitimate way to depend on
# something, and pinning them is required by the universal core: a tool that decides pass/fail is a
# pinned input. Note what is NOT listed: `pydantic`, the only real runtime dependency, which deptry
# correctly finds imported. If a genuinely unused library is ever added, this list will not hide it.
DEP002 = ["ruff", "pytest", "pytest-randomly", "pip-audit", "pre-commit", "deptry"]
