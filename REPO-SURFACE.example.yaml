# REPO-SURFACE — what this repo IS, so the repo-fitness bar applies only the parts that fit.
# The scaffolder should generate a draft of this; you confirm it. It is the router: the universal core
# always applies, and each surface set `true` switches on that conditional pack in references/RUBRIC.md.
# Keep it honest — a false `false` hides a real obligation; a false `true` invites N/A "findings".

repo_kind: tool          # service | library | cli | frontend | data-pipeline | iac | model-ai | rules-engine | tool
owned_command: make check
criticality: internal    # sandbox | internal | production | regulated

surfaces:
  deployed: false               # runs as a long-lived service (→ shutdown, timeouts/retries, health, telemetry, safe defaults)
  stateful: false               # owns persistent data (→ migrations, retention, resource cleanup, tested restore)
  user_facing: false            # exposed to external callers (→ authz default-deny, injection defense, backward-compat)
  has_consumers: false          # other code/teams depend on its contract (→ backward-compat contract, deprecation)
  handles_pii: false            # processes personal data (→ PII-in-logs redaction, retention)
  handles_secrets: false        # holds/uses credentials at runtime (→ secrets from a manager, not plaintext)
  external_network: false       # makes caller-influenced outbound calls (→ anti-SSRF allowlist, timeouts)
  decisioning_or_scoring: false # derives/ranks/matches/decides (→ externalized policy, provenance, explanation, abstain)
  data_measurement: false       # carries measured/analytics values (→ {value,unit,source}, canonicalize-on-write, schema-on-read)
  generated_code: false         # commits generated artifacts (→ regenerate-clean-diff freshness)
  stores_or_shows_time: false   # stores or displays timestamps (→ tz-aware UTC at rest, locale formatter, DST tests)
  compute_or_ci_heavy: false    # expensive jobs / heavy CI (→ efficiency: bounded CI, timeouts, caching, budgets)

# One paragraph, also mirrored into docs/overview.md:
# - the one concern + its entry point (the canonical path)
# - where config/truth lives + the one config boundary
# - the external boundaries: inputs, outputs, APIs, events, files, secrets, network, persisted state
notes: |
  [fill: what this repo does, its entry point, its config boundary, and its external boundaries]
